global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080', 'host.docker.internal:8081']

  - job_name: 'influxdb'
    static_configs:
      - targets:
          - 'influxdb:8089'

  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'