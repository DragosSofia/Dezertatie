spring.application.name=Auth
############################################
# Server
############################################
server.port=8080

############################################
# Virtual Threads (JDK 21+)
############################################
spring.threads.virtual.enabled=true

############################################
# Datasource (PostgreSQL)
############################################
#Directly to DB
#spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
#Through toxyproxy to DB
spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=authuser
spring.datasource.password=authpass
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

############################################
# Connection Pool (HikariCP)
############################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

############################################
# JWT Security
############################################
security.jwt.secret=9fA7Dk3M2RZqVJwB6C8xE4HnL5TUpY0sQm1KcSgPFaW8rJdX
security.jwt.expiration=86400000

############################################
# Logging
############################################
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
############################################
# Rate limiting 
############################################
rate-limit.requests=20
rate-limit.minutes=1
############################################
# Prometheus
############################################
management.endpoints.web.exposure.include=health,info,prometheus,metrics,httpexchanges
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.enable.jvm=true
management.endpoint.prometheus.enabled=true

# Tag every metric so the dashboard can split by service
management.metrics.tags.application=${spring.application.name}

# Enable HTTP server request histograms / percentiles (P50, P95, P99, P99.9)
# Required for proper latency analysis (Apdex, SLO buckets, heatmaps).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99,0.999
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# Histograms on our custom timers too (login/register/token lookup)
management.metrics.distribution.percentiles-histogram.auth=true

############################################
# BCrypt executor
# Bounded platform-thread pool so password hashing does not pin virtual-thread
# carriers. 0 = auto-size to availableProcessors().
############################################
app.bcrypt.threads=0