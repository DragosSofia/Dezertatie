spring.application.name=Auth
############################################
# Server
############################################
server.port=8080

############################################
# Datasource (PostgreSQL)
############################################
#Directly to DB
#spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
#Through toxyproxy to DB
spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=authuser
spring.datasource.password=authpass
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

############################################
# Connection Pool (HikariCP)
# Sized for perf-test load on a 6c/12t machine:
#  - max=20: Hikari "small is fast"; bcrypt pool (4) is the real login bottleneck.
#  - minIdle=10: keep connections warm so cold starts don't show up in p99.
#  - connection-timeout=5s: fail fast under saturation to surface the bottleneck.
#  - leak-detection: log any borrow held longer than 20s.
############################################
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000

############################################
# JWT Security
############################################
security.jwt.secret=9fA7Dk3M2RZqVJwB6C8xE4HnL5TUpY0sQm1KcSgPFaW8rJdX
security.jwt.expiration=86400000

############################################
# Logging
############################################
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
############################################
# Rate limiting 
############################################
rate-limit.requests=50
rate-limit.minutes=1
############################################
# Prometheus
############################################
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.enable.jvm=true
management.endpoint.prometheus.enabled=true