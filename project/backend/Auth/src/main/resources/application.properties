spring.application.name=Auth
############################################
# Server
############################################
server.port=8080

############################################
# Virtual Threads (JDK 21+)
############################################
spring.threads.virtual.enabled=false

############################################
# Datasource (PostgreSQL)
############################################
#Directly to DB
#spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
#Through toxyproxy to DB
spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=authuser
spring.datasource.password=authpass
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
# Perf-test note: show-sql + format_sql + Hibernate SQL DEBUG + binder TRACE
# (see Logging section) produces a multi-line log block per query. Under load this
# dominates throughput. Keep off for perf runs; flip on only for debugging.
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

############################################
# Connection Pool (HikariCP)
# Sized for perf-test load on a 6c/12t machine with VTs disabled here. With bcrypt
# running inline on Tomcat platform threads, the pool gates concurrent register/login.
#  - max=20: Hikari "small is fast"; keep Postgres unsaturated (~2x cores).
#  - minIdle=10: warm pool — no ramp-up in first burst of a load test.
#  - connection-timeout=5s: fail fast under saturation; surfaces the bottleneck.
#  - leak-detection: log any borrow held longer than 20s.
############################################
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.pool-name=AuthHikari
# Hibernate manages transactions; skip the driver's autocommit flip per borrow.
spring.datasource.hikari.auto-commit=false

# Postgres JDBC driver tuning (forwarded by Hikari as connection properties):
#  - prepareThreshold=3: switch repeated SQL to server-side prepared statements faster.
#  - preparedStatementCacheQueries / SizeMiB: bigger client-side PS cache.
#  - tcpKeepAlive=true: detect half-open sockets across long perf runs.
#  - socketTimeout=30: cap stuck queries instead of holding a Hikari connection forever.
spring.datasource.hikari.data-source-properties.prepareThreshold=3
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=8
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.socketTimeout=30

############################################
# JWT Security
############################################
security.jwt.secret=9fA7Dk3M2RZqVJwB6C8xE4HnL5TUpY0sQm1KcSgPFaW8rJdX
security.jwt.expiration=86400000

############################################
# Logging
############################################
logging.level.org.springframework.security=INFO
# Set to DEBUG / TRACE only when debugging — both kill perf under load.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
############################################
# Rate limiting 
############################################
rate-limit.requests=20
rate-limit.minutes=1
############################################
# Prometheus
############################################
management.endpoints.web.exposure.include=health,info,prometheus,metrics,httpexchanges
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.enable.jvm=true
management.endpoint.prometheus.enabled=true

# Tag every metric so the dashboard can split by service
management.metrics.tags.application=${spring.application.name}

# Enable HTTP server request histograms / percentiles (P50, P95, P99, P99.9)
# Required for proper latency analysis (Apdex, SLO buckets, heatmaps).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99,0.999
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# Histograms on our custom timers too (login/register/token lookup)
management.metrics.distribution.percentiles-histogram.auth=true