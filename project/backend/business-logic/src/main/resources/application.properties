# My custom InfluxDB client config
influx.url=http://localhost:8085/
influx.token=9e1e47d8e60f13ca12cccb05537e88c84aaa36d9d193ad2858fbb7daa06af7d2
influx.org=org
influx.bucket=mesurements

############################################
# InfluxDB OkHttp client tuning
# Library defaults are maxRequests=64, maxRequestsPerHost=5, idleConnections=5
# (5min keep-alive). The per-host=5 and idleConnections=5 are the real chokepoints
# for a single-host Influx under perf load. All wired up in InfluxConfig.
############################################
app.influx.okhttp.max-requests=128
app.influx.okhttp.max-requests-per-host=64
# Reuse ~one idle connection per concurrent in-flight call so HTTP/1.1 keep-alive
# is actually utilised. Default of 5 forces churn on every burst.
app.influx.okhttp.max-idle-connections=64
app.influx.okhttp.keep-alive-minutes=5
# Localhost connect must be near-instant; bump only if Influx is remote.
# read-timeout sized for the slowest Flux query you expect.
app.influx.okhttp.connect-timeout-ms=2000
app.influx.okhttp.read-timeout-ms=30000
app.influx.okhttp.write-timeout-ms=10000

############################################
# Server
############################################
server.port=8081
############################################
# Auth Microservice
############################################
auth.server.link = http://localhost:8080
############################################
# Prometheus
############################################
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.enable.jvm=true
############################################
# IO Executor (used for parallel auth + Influx calls)
############################################
app.executor.core-pool-size=24
app.executor.max-pool-size=200
app.executor.queue-capacity=50
app.executor.keep-alive-seconds=60
