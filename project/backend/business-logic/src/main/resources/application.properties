spring.application.name=demo
spring.main.allow-bean-definition-overriding=true
############################################
# Virtual threads (Java 21+)
# Makes Tomcat request threads, @Async, and scheduled tasks run on virtual threads.
############################################
spring.threads.virtual.enabled=true
## InfluxDB Micrometer Registry Configuration for v2
management.influx.metrics.export.enabled=false
#management.metrics.tags.application=PickACard
#management.influx.metrics.export.api-version=v2
#management.influx.metrics.export.batch-size=10000
#management.influx.metrics.export.compressed=true
#management.influx.metrics.export.connect-timeout=1s
#management.influx.metrics.export.enabled=true
#management.influx.metrics.export.read-timeout=10s
#management.influx.metrics.export.step=1m
#management.influx.metrics.export.bucket=mesurements
#management.influx.metrics.export.org=org
#management.influx.metrics.export.token=9e1e47d8e60f13ca12cccb05537e88c84aaa36d9d193ad2858fbb7daa06af7d2
#management.influx.metrics.export.uri=http://localhost:8086/

# My custom InfluxDB client config
influx.url=http://localhost:8085/
influx.token=9e1e47d8e60f13ca12cccb05537e88c84aaa36d9d193ad2858fbb7daa06af7d2
influx.org=org
influx.bucket=mesurements

############################################
# Server
############################################
server.port=8081
############################################
# Auth Microservice
############################################
auth.server.link = http://localhost:8080
############################################
# Prometheus
############################################
management.endpoints.web.exposure.include=health,info,prometheus,metrics,httpexchanges
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.enable.jvm=true

# Tag every metric so the dashboard can split by service
management.metrics.tags.application=${spring.application.name}

# HTTP server request histograms / percentiles (P50, P95, P99, P99.9)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99,0.999
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# WebClient (outgoing inter-service calls)
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles.http.client.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.resource=true
