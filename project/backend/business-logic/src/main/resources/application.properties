#management.influx.metrics.export.uri=http://localhost:8086/

# My custom InfluxDB client config
influx.url=http://localhost:8085/
influx.token=9e1e47d8e60f13ca12cccb05537e88c84aaa36d9d193ad2858fbb7daa06af7d2
influx.org=org
influx.bucket=mesurements

############################################
# InfluxDB OkHttp client tuning
# This branch uses unbounded virtual threads — the OkHttp dispatcher is the ONLY
# backpressure point between business-logic and Influx. Defaults are
# maxRequests=64, maxRequestsPerHost=5, idleConnections=5. Per-host=5 and
# idleConnections=5 strangle a single-host Influx under fan-out load.
# Wired up in InfluxConfig.
############################################
app.influx.okhttp.max-requests=128
app.influx.okhttp.max-requests-per-host=64
# Idle pool sized to match peak concurrency so HTTP/1.1 keep-alive is actually used.
app.influx.okhttp.max-idle-connections=64
app.influx.okhttp.keep-alive-minutes=5
# Localhost connect must be near-instant; bump only if Influx is remote.
app.influx.okhttp.connect-timeout-ms=2000
app.influx.okhttp.read-timeout-ms=30000
app.influx.okhttp.write-timeout-ms=10000

############################################
# Server
############################################
server.port=8081
############################################
# Auth Microservice
############################################
auth.server.link = http://localhost:8080
############################################
# Prometheus
############################################
management.endpoints.web.exposure.include=health,info,prometheus,metrics,httpexchanges
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.enable.jvm=true

# Tag every metric so the dashboard can split by service
management.metrics.tags.application=${spring.application.name}

# HTTP server request histograms / percentiles (P50, P95, P99, P99.9)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99,0.999
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# WebClient (outgoing inter-service calls)
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles.http.client.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.resource=true

############################################
# IO executor backpressure (virtual threads + semaphore)
# Caps how many auth+influx fan-out tasks can run concurrently.
############################################
app.executor.permits=128
